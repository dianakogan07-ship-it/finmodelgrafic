services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: suz
      POSTGRES_USER: suz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suz -d suz"]
      interval: 5s
      retries: 20

  calc:
    build: ./calc-worker
    restart: unless-stopped
    environment:
      MODEL_DIR: /data/models
      CALC_MAX_BOOKS: ${CALC_MAX_BOOKS:-1}
    volumes:
      - ./data:/data:ro
    mem_limit: ${CALC_MEM_LIMIT:-4g}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      calc:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://suz:${POSTGRES_PASSWORD}@db:5432/suz
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?задайте ADMIN_LOGIN в .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      CALC_URLS: http://calc:8001
      MODEL_DIR: /data/models
      SEED_MODEL: /data/model.xlsx
    volumes:
      - ./data:/data

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
